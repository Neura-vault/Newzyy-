name: Generate static article pages

# Runs on a schedule so new articles get a real, crawlable static page
# automatically, and the RSS feed mirror stays fresh. Also runnable by hand
# from the Actions tab, and after any push to main (harmless if there's
# nothing new to generate — the script skips articles that already have a
# static file, and just overwrites rss.xml each time).
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: generate-static
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static article pages + sitemap + RSS mirror
        run: node scripts/generate-static.js

      - name: Commit and push if anything changed
        run: |
          git config user.name "newzyy-static-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news/ sitemap.xml rss.xml
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: regenerate static article pages + rss mirror [skip ci]"
            git push
          fi
