<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8">
    <title>Admin — Newzyy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="plugins/font-awesome/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
    <style>
        :root { --red:#b80000; --ink:#141414; --paper:#ffffff; --canvas:#f7f6f2; --hairline:#e3ded3; --muted:#6e6a62;
            --sans:'Inter',sans-serif; --serif:'Source Serif 4',Georgia,serif; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--sans); background:var(--canvas); color:var(--ink); }
        a { text-decoration:none; }
        .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px; }
        .gate input { padding:12px 16px; border:1px solid var(--hairline); font-size:0.95rem; width:280px; margin-bottom:12px; }
        .gate button { padding:12px 24px; background:var(--red); color:#fff; border:none; font-weight:700; cursor:pointer; text-transform:uppercase; font-size:0.8rem; letter-spacing:0.4px; }
        .gate .error { color:var(--red); font-size:0.85rem; margin-top:10px; }
        #dashboard { display:none; max-width:1200px; margin:0 auto; padding:30px 20px 70px; }
        h1 { font-family:var(--serif); font-size:1.8rem; margin-bottom:24px; }
        h2.section-title { font-family:var(--serif); font-size:1.15rem; margin:36px 0 14px; }
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
        .stat-card { background:var(--paper); border:1px solid var(--hairline); padding:20px; text-align:center; }
        .stat-card .num { font-family:var(--serif); font-size:2rem; font-weight:700; color:var(--red); }
        .stat-card .label { font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; margin-top:4px; }
        .quick-actions { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:30px; }
        .qa-btn { padding:10px 18px; background:var(--ink); color:#fff; border:none; font-size:0.78rem; font-weight:600; cursor:pointer; }
        .qa-btn:hover { opacity:0.85; }
        .qa-btn.danger { background:var(--red); }
        .qa-status { font-size:0.78rem; color:var(--muted); margin-bottom:20px; }

        .ai-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-bottom:14px; }
        .ai-card { background:var(--paper); border:1px solid var(--hairline); padding:16px 18px; }
        .ai-card .name { font-size:0.85rem; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
        .ai-card .name .provider-badge { font-size:0.62rem; font-weight:700; padding:2px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:0.3px; }
        .ai-card .name .provider-badge.on { background:#dcfce7; color:#16a34a; }
        .ai-card .name .provider-badge.off { background:#fee2e2; color:var(--red); }
        .ai-bar-row { margin-top:10px; }
        .ai-bar-row .lbl { font-size:0.7rem; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:3px; }
        .ai-bar-track { height:8px; background:var(--hairline); border-radius:5px; overflow:hidden; }
        .ai-bar-fill { height:100%; background:var(--red); }
        .ai-bar-fill.blue { background:#2563eb; }
        .ai-bar-fill.purple { background:#7c3aed; }
        .ai-bar-fill.orange { background:#ea580c; }
        .ai-bar-fill.teal { background:#0d9488; }

        .coverage-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
        .coverage-card { background:var(--paper); border:1px solid var(--hairline); padding:12px 14px; text-align:center; }
        .coverage-card .lang { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.3px; color:var(--muted); }
        .coverage-card .frac { font-family:var(--serif); font-size:1.3rem; font-weight:700; margin-top:4px; }
        .coverage-card .frac.full { color:#16a34a; }
        .coverage-card .frac.partial { color:#ea580c; }
        .coverage-card .frac.low { color:var(--red); }

        .category-pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
        .category-pill { font-size:0.72rem; padding:4px 10px; background:var(--canvas); border:1px solid var(--hairline); }
        .tabs { display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; }
        .tab-btn { padding:10px 18px; background:none; border:none; font-weight:600; font-size:0.85rem; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
        .tab-btn.active { color:var(--red); border-bottom-color:var(--red); }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }
        table { width:100%; border-collapse:collapse; background:var(--paper); }
        th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--hairline); font-size:0.83rem; vertical-align:top; }
        th { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.3px; color:var(--muted); }
        .badge { padding:2px 8px; font-size:0.66rem; font-weight:700; border-radius:3px; }
        .badge.yes { background:#dcfce7; color:#16a34a; }
        .badge.no { background:#fee2e2; color:var(--red); }
        .badge.warn { background:#fef3c7; color:#b45309; }
        .msg-body { max-width:280px; white-space:pre-wrap; font-size:0.78rem; color:var(--muted); }
        .row-actions { display:flex; gap:6px; }
        .row-actions button { padding:5px 10px; font-size:0.7rem; border:1px solid var(--hairline); background:var(--paper); cursor:pointer; }
        .row-actions button.delete { color:var(--red); border-color:var(--red); }
        .refresh-btn { padding:8px 16px; background:none; border:1px solid var(--hairline); font-size:0.78rem; cursor:pointer; margin-bottom:16px; }
        .thumb { width:60px; height:42px; object-fit:cover; }
        .write-form { background:var(--paper); border:1px solid var(--hairline); padding:20px; max-width:720px; }
        .write-form label { display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.3px; color:var(--muted); margin:14px 0 5px; }
        .write-form label:first-child { margin-top:0; }
        .write-form input[type=text], .write-form select, .write-form textarea { width:100%; padding:10px 12px; border:1px solid var(--hairline); font-family:var(--sans); font-size:0.88rem; background:var(--canvas); }
        .write-form textarea { resize:vertical; min-height:70px; }
        .write-form textarea#waBody { min-height:220px; }
        .write-form .hint { font-size:0.72rem; color:var(--muted); margin-top:4px; }
        .write-form .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:16px; }
        .write-form .checkbox-row label { margin:0; text-transform:none; font-size:0.85rem; color:var(--ink); }
        .write-form .img-preview { max-width:220px; max-height:140px; object-fit:cover; margin-top:8px; display:none; border:1px solid var(--hairline); }
        .write-form .submit-row { margin-top:20px; display:flex; align-items:center; gap:14px; }
        .write-form .submit-btn { padding:12px 26px; background:var(--red); color:#fff; border:none; font-weight:700; cursor:pointer; text-transform:uppercase; font-size:0.78rem; letter-spacing:0.4px; }
        .write-form .submit-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .write-status { font-size:0.82rem; color:var(--muted); }
        .write-status.err { color:var(--red); }
        .write-status.ok { color:#16a34a; }
        .row-actions button.small-link { border:none; background:none; color:var(--muted); text-decoration:underline; padding:5px 4px; }
        @media (max-width:800px){ .stats-row{grid-template-columns:repeat(2,1fr);} }
    </style>
</head>
<body>

<div class="gate" id="gate">
    <h1 style="margin-bottom:16px;">Admin Access</h1>
    <input type="password" id="secretInput" placeholder="Admin secret">
    <button onclick="unlock()">Enter</button>
    <div class="error" id="gateError"></div>
</div>

<div id="dashboard">
    <h1>Newzyy Admin Dashboard</h1>

    <div class="stats-row" id="statsRow"></div>

    <div class="quick-actions">
        <button class="qa-btn" onclick="runAction('/manual-fetch', 'Fetching news now...')"><i class="fa fa-refresh"></i> Run News Fetch Now</button>
        <button class="qa-btn" onclick="runAction('/admin/run-translation-now', 'Running translation cycle...')"><i class="fa fa-language"></i> Run Translation Now</button>
        <button class="qa-btn" onclick="runAction('/admin/send-newsletter-now', 'Sending newsletter...')"><i class="fa fa-envelope"></i> Send Newsletter Now</button>
        <button class="qa-btn danger" onclick="if(confirm('Delete all non-rewritten articles?')) runAction('/admin/purge-non-rewritten', 'Purging...')">Purge Non-Rewritten</button>
        <button class="qa-btn danger" onclick="if(confirm('This deletes EVERY article permanently. Are you sure?')) runAction('/admin/purge-all?confirm=YES', 'Purging everything...')">Purge ALL Articles</button>
    </div>
    <div class="qa-status" id="qaStatus"></div>

    <h2 class="section-title">AI Provider Quota — Today</h2>
    <div class="ai-grid" id="aiGrid"></div>
    <div class="category-pills" id="categoryPills"></div>

    <h2 class="section-title">Translation Coverage <span style="font-size:0.7rem;color:var(--muted);font-weight:400;">— how many published articles have each language</span></h2>
    <div class="coverage-grid" id="coverageGrid"></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('articles')">Articles</button>
        <button class="tab-btn" onclick="showTab('write')">Write Article</button>
        <button class="tab-btn" onclick="showTab('contacts')">Contact Messages</button>
        <button class="tab-btn" onclick="showTab('users')">Users</button>
        <button class="tab-btn" onclick="showTab('subscribers')">Newsletter Subscribers</button>
    </div>

    <button class="refresh-btn" onclick="loadAll()"><i class="fa fa-refresh"></i> Refresh</button>

    <div class="tab-panel active" id="panel-articles">
        <div style="display:flex;gap:10px;margin-bottom:14px;">
            <input type="text" id="articleSearch" placeholder="Search articles by title or category..." style="flex:1;padding:9px 12px;border:1px solid var(--hairline);font-size:0.85rem;" oninput="filterArticles()">
            <button class="refresh-btn" style="margin:0;" onclick="exportCSV('articles')">Export CSV</button>
        </div>
        <div id="articlesTableWrap"></div>
    </div>
    <div class="tab-panel" id="panel-write">
        <div class="write-form">
            <h2 class="section-title" style="margin-top:0;" id="waFormTitle">Write a New Article</h2>
            <input type="hidden" id="waEditingId" value="">

            <label>Title</label>
            <input type="text" id="waTitle" placeholder="Headline">

            <label>Category</label>
            <select id="waCategory"></select>

            <label>Image URL <span style="text-transform:none;">(direct link to a public image, e.g. ending in .jpg/.png)</span></label>
            <input type="text" id="waImage" placeholder="https://..." oninput="previewWaImage()">
            <img class="img-preview" id="waImagePreview">

            <label>Excerpt <span style="text-transform:none;">(optional — short summary shown in article lists; auto-generated from the body if left blank)</span></label>
            <textarea id="waExcerpt" placeholder="One or two sentence summary..."></textarea>

            <label>Body <span style="text-transform:none;">(separate paragraphs with a blank line)</span></label>
            <textarea id="waBody" placeholder="Write the full article here..."></textarea>

            <label>Author <span style="text-transform:none;">(optional — defaults to "Newzyy Staff")</span></label>
            <input type="text" id="waAuthor" placeholder="Newzyy Staff">

            <div class="checkbox-row">
                <input type="checkbox" id="waAutoTranslate" checked>
                <label for="waAutoTranslate">Auto-translate into all 9 languages using AI (recommended — leave off only for a quick edit that doesn't change the text)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="waBreaking">
                <label for="waBreaking">Mark as Breaking</label>
            </div>

            <div class="submit-row">
                <button class="submit-btn" id="waSubmitBtn" onclick="submitWriteArticle()">Publish Article</button>
                <button class="qa-btn" style="background:var(--muted);display:none;" id="waCancelBtn" onclick="resetWaForm()">Cancel Edit</button>
                <span class="write-status" id="waStatus"></span>
            </div>
        </div>
    </div>
    <div class="tab-panel" id="panel-contacts"></div>
    <div class="tab-panel" id="panel-users"></div>
    <div class="tab-panel" id="panel-subscribers"></div>
</div>

<script>
const API_BASE = 'https://newzyy.onrender.com';
let SECRET = sessionStorage.getItem('newzyy_admin_secret') || '';

function unlock() {
    const val = document.getElementById('secretInput').value.trim();
    if (!val) return;
    SECRET = val;
    sessionStorage.setItem('newzyy_admin_secret', val);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
}

function showTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
}

async function apiGet(path) {
    const res = await fetch(`${API_BASE}${path}${path.includes('?') ? '&' : '?'}secret=${encodeURIComponent(SECRET)}`);
    const data = await res.json();
    if (res.status === 403) throw new Error('WRONG_SECRET');
    return data;
}
async function apiCall(path, method) {
    const res = await fetch(`${API_BASE}${path}${path.includes('?') ? '&' : '?'}secret=${encodeURIComponent(SECRET)}`, { method });
    return res.json();
}
async function apiPost(path, method, bodyObj) {
    const res = await fetch(`${API_BASE}${path}${path.includes('?') ? '&' : '?'}secret=${encodeURIComponent(SECRET)}`, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyObj)
    });
    return res.json();
}

async function runAction(path, statusMsg) {
    const statusEl = document.getElementById('qaStatus');
    statusEl.textContent = statusMsg;
    try {
        const data = await apiGet(path);
        statusEl.textContent = data.message || 'Done.';
        setTimeout(loadAll, 2000);
    } catch (e) {
        statusEl.textContent = 'Something went wrong.';
    }
}

async function loadAll() {
    try {
        const stats = await apiGet('/api/admin/stats');
        if (!stats.success) throw new Error(stats.message || 'Failed');
        renderStats(stats.stats, stats.perCategory, stats.ai);

        const [articles, contacts, users, subs, coverage] = await Promise.all([
            apiGet('/api/admin/articles'),
            apiGet('/api/admin/contacts'),
            apiGet('/api/admin/users'),
            apiGet('/api/admin/subscribers'),
            apiGet('/api/admin/translation-coverage')
        ]);
        renderArticles(articles.articles || []);
        renderContacts(contacts.messages || []);
        renderUsers(users.users || []);
        renderSubscribers(subs.subscribers || []);
        renderCoverage(coverage);
    } catch (e) {
        if (e.message === 'WRONG_SECRET') {
            sessionStorage.removeItem('newzyy_admin_secret');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('gate').style.display = 'flex';
            document.getElementById('gateError').textContent = 'Wrong secret.';
        } else {
            document.getElementById('statsRow').innerHTML = `<p style="color:var(--red)">Could not load dashboard data.</p>`;
        }
    }
}

function renderStats(s, perCategory, ai) {
    document.getElementById('statsRow').innerHTML = `
        <div class="stat-card"><div class="num">${s.articleCount}</div><div class="label">Articles</div></div>
        <div class="stat-card"><div class="num">${s.userCount}</div><div class="label">Users</div></div>
        <div class="stat-card"><div class="num">${s.subscriberCount}</div><div class="label">Newsletter Subs</div></div>
        <div class="stat-card"><div class="num">${s.contactCount}</div><div class="label">Contact Messages</div></div>
    `;
    renderAiGrid(ai);
    if (perCategory) {
        document.getElementById('categoryPills').innerHTML = perCategory
            .sort((a, b) => b.count - a.count)
            .map(c => `<span class="category-pill">${c._id}: ${c.count}</span>`).join('');
    }
}

// One card per provider. Gemini/Groq/Mistral show two bars (rewrite quota is
// separate from translate quota — they can never starve each other). Cerebras
// and Cohere are rewrite-only, so they get a single bar.
function aiBar(label, callsToday, maxPerDay, colorClass) {
    const pct = maxPerDay ? Math.min(100, Math.round((callsToday / maxPerDay) * 100)) : 0;
    return `
        <div class="ai-bar-row">
            <div class="lbl"><span>${label}</span><span>${callsToday} / ${maxPerDay}</span></div>
            <div class="ai-bar-track"><div class="ai-bar-fill ${colorClass || ''}" style="width:${pct}%"></div></div>
        </div>`;
}
function renderAiGrid(ai) {
    const grid = document.getElementById('aiGrid');
    if (!ai) { grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;">Could not load AI quota data.</p>'; return; }

    const cards = [];

    if (ai.gemini) {
        const geminiLabel = ai.gemini.configured ? `Active (${ai.gemini.keysConfigured} key${ai.gemini.keysConfigured === 1 ? '' : 's'})` : 'Not configured';
        cards.push(`
            <div class="ai-card">
                <div class="name">Gemini <span class="provider-badge ${ai.gemini.configured ? 'on' : 'off'}">${geminiLabel}</span></div>
                ${aiBar('Rewrite', ai.gemini.rewrite.callsToday, ai.gemini.rewrite.maxPerDay, '')}
                ${aiBar('Translate', ai.gemini.translate.callsToday, ai.gemini.translate.maxPerDay, 'blue')}
                ${ai.gemini.image ? aiBar('Images', ai.gemini.image.callsToday, ai.gemini.image.maxPerDay, 'purple') : ''}
            </div>`);
    }
    if (ai.groq) {
        cards.push(`
            <div class="ai-card">
                <div class="name">Groq <span class="provider-badge ${ai.groq.configured ? 'on' : 'off'}">${ai.groq.configured ? 'Active' : 'Not configured'}</span></div>
                ${ai.groq.configured ? `
                    ${aiBar('Rewrite', ai.groq.rewrite.callsToday, ai.groq.rewrite.maxPerDay, '')}
                    ${aiBar('Translate', ai.groq.translate.callsToday, ai.groq.translate.maxPerDay, 'blue')}
                ` : `<p style="font-size:0.75rem;color:var(--muted);margin-top:8px;">Add GROQ_API_KEY on Render to enable.</p>`}
            </div>`);
    }
    if (ai.mistral) {
        cards.push(`
            <div class="ai-card">
                <div class="name">Mistral <span class="provider-badge ${ai.mistral.configured ? 'on' : 'off'}">${ai.mistral.configured ? 'Active' : 'Not configured'}</span></div>
                ${ai.mistral.configured ? `
                    ${aiBar('Rewrite', ai.mistral.rewrite.callsToday, ai.mistral.rewrite.maxPerDay, '')}
                    ${aiBar('Translate', ai.mistral.translate.callsToday, ai.mistral.translate.maxPerDay, 'blue')}
                ` : `<p style="font-size:0.75rem;color:var(--muted);margin-top:8px;">Add MISTRAL_API_KEY on Render to enable.</p>`}
            </div>`);
    }
    if (ai.cerebras) {
        cards.push(`
            <div class="ai-card">
                <div class="name">Cerebras <span class="provider-badge ${ai.cerebras.configured ? 'on' : 'off'}">${ai.cerebras.configured ? 'Active' : 'Not configured'}</span></div>
                ${ai.cerebras.configured
                    ? aiBar('Rewrite (fallback)', ai.cerebras.callsToday, ai.cerebras.maxPerDay, 'purple')
                    : `<p style="font-size:0.75rem;color:var(--muted);margin-top:8px;">Add CEREBRAS_API_KEY on Render to enable.</p>`}
            </div>`);
    }
    if (ai.cohere) {
        cards.push(`
            <div class="ai-card">
                <div class="name">Cohere <span class="provider-badge ${ai.cohere.configured ? 'on' : 'off'}">${ai.cohere.configured ? 'Active' : 'Not configured'}</span></div>
                ${ai.cohere.configured
                    ? aiBar('Rewrite (fallback)', ai.cohere.callsToday, ai.cohere.maxPerDay, 'orange')
                    : `<p style="font-size:0.75rem;color:var(--muted);margin-top:8px;">Add COHERE_API_KEY on Render to enable.</p>`}
            </div>`);
    }

    grid.innerHTML = cards.join('');
}

function renderCoverage(data) {
    const grid = document.getElementById('coverageGrid');
    if (!data || !data.success) { grid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;">Could not load translation coverage.</p>'; return; }
    const total = data.total || 0;
    grid.innerHTML = Object.keys(data.coverage || {}).map(langCode => {
        const count = data.coverage[langCode];
        const pct = total ? count / total : 0;
        const cls = pct >= 0.95 ? 'full' : pct >= 0.6 ? 'partial' : 'low';
        const name = (data.languages && data.languages[langCode] && data.languages[langCode].name) || langCode;
        return `
            <div class="coverage-card">
                <div class="lang">${name}</div>
                <div class="frac ${cls}">${count}/${total}</div>
            </div>`;
    }).join('');
}

let allArticlesData = [];
let allContactsData = [];
let allUsersData = [];
let allSubscribersData = [];

function renderArticles(items) {
    allArticlesData = items;
    filterArticles();
}
function translationBadge(a) {
    const done = a.translations ? Object.keys(a.translations).length : 0;
    const expected = 9; // number of ACTIVE_LANGUAGES on the backend
    if (done >= expected) return `<span class="badge yes">${done}/${expected}</span>`;
    if (done === 0) return `<span class="badge no">${done}/${expected}</span>`;
    return `<span class="badge warn">${done}/${expected}</span>`;
}
function filterArticles() {
    const q = (document.getElementById('articleSearch')?.value || '').toLowerCase();
    const items = allArticlesData.filter(a => a.title.toLowerCase().includes(q) || a.category.toLowerCase().includes(q));
    const el = document.getElementById('articlesTableWrap');
    if (!items.length) { el.innerHTML = '<p style="color:var(--muted)">No articles found.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>Image</th><th>Title</th><th>Category</th><th>Views</th><th>Translated</th><th>Breaking</th><th>Date</th><th></th></tr></thead><tbody>
        ${items.map(a => {
            const done = a.translations ? Object.keys(a.translations).length : 0;
            return `<tr>
            <td><img class="thumb" src="${a.image}" onerror="this.style.display='none'"></td>
            <td>${a.title}</td>
            <td>${a.category}</td>
            <td>${a.views}</td>
            <td>${translationBadge(a)}</td>
            <td><span class="badge ${a.manualBreaking ? 'yes' : 'no'}">${a.manualBreaking ? 'ON' : 'off'}</span></td>
            <td>${new Date(a.fetched_at).toLocaleDateString()}</td>
            <td class="row-actions">
                <button onclick="window.open('https://newzyy.site/article/?id=${a.id}','_blank')">View</button>
                <button onclick="editArticle('${a.id}')">Edit</button>
                ${done < 9 ? `<button onclick="retranslateMissing('${a.id}')">Fill Translations</button>` : ''}
                <button onclick="toggleBreaking('${a.id}')">${a.manualBreaking ? 'Unmark' : 'Mark'} Breaking</button>
                <button class="delete" onclick="deleteArticle('${a.id}')">Delete</button>
            </td>
        </tr>`;
        }).join('')}
    </tbody></table>`;
}
async function toggleBreaking(id) {
    await apiCall(`/api/admin/article/${id}/toggle-breaking`, 'PATCH');
    loadAll();
}

// ----- Write / Edit Article -----
// Same category slugs as CATEGORIES in server.js — keep this list in sync if
// a category is ever added or renamed on the backend.
const WA_CATEGORIES = ['politics', 'technology', 'ai', 'sports', 'business', 'health', 'science', 'entertainment', 'travel', 'environment', 'culture', 'world', 'economy'];
(function populateWaCategories() {
    const sel = document.getElementById('waCategory');
    if (!sel) return;
    sel.innerHTML = WA_CATEGORIES.map(c => `<option value="${c}">${c.charAt(0).toUpperCase() + c.slice(1)}</option>`).join('');
})();

function previewWaImage() {
    const url = document.getElementById('waImage').value.trim();
    const img = document.getElementById('waImagePreview');
    if (!url) { img.style.display = 'none'; return; }
    img.src = url;
    img.onload = () => { img.style.display = 'block'; };
    img.onerror = () => { img.style.display = 'none'; };
}

function htmlBodyToPlainText(html) {
    return (html || '').replace(/<\/p>\s*<p>/gi, '\n\n').replace(/<\/?p>/gi, '').trim();
}

function resetWaForm() {
    document.getElementById('waEditingId').value = '';
    document.getElementById('waFormTitle').textContent = 'Write a New Article';
    document.getElementById('waTitle').value = '';
    document.getElementById('waCategory').selectedIndex = 0;
    document.getElementById('waImage').value = '';
    document.getElementById('waImagePreview').style.display = 'none';
    document.getElementById('waExcerpt').value = '';
    document.getElementById('waBody').value = '';
    document.getElementById('waAuthor').value = '';
    document.getElementById('waAutoTranslate').checked = true;
    document.getElementById('waBreaking').checked = false;
    document.getElementById('waSubmitBtn').textContent = 'Publish Article';
    document.getElementById('waCancelBtn').style.display = 'none';
    document.getElementById('waStatus').textContent = '';
    document.getElementById('waStatus').className = 'write-status';
}

function editArticle(id) {
    const a = allArticlesData.find(x => x.id === id);
    if (!a) return;
    document.getElementById('waEditingId').value = a.id;
    document.getElementById('waFormTitle').textContent = 'Edit Article';
    document.getElementById('waTitle').value = a.title || '';
    document.getElementById('waCategory').value = a.category || WA_CATEGORIES[0];
    document.getElementById('waImage').value = a.image || '';
    previewWaImage();
    document.getElementById('waExcerpt').value = a.excerpt || '';
    document.getElementById('waBody').value = htmlBodyToPlainText(a.body);
    document.getElementById('waAuthor').value = a.author || '';
    document.getElementById('waAutoTranslate').checked = false; // editing: off by default, don't re-burn AI quota unless asked
    document.getElementById('waBreaking').checked = Boolean(a.manualBreaking);
    document.getElementById('waSubmitBtn').textContent = 'Save Changes';
    document.getElementById('waCancelBtn').style.display = 'inline-block';
    document.getElementById('waStatus').textContent = '';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-write').classList.add('active');
    [...document.querySelectorAll('.tab-btn')].find(b => b.textContent === 'Write Article')?.classList.add('active');
}

async function submitWriteArticle() {
    const editingId = document.getElementById('waEditingId').value;
    const title = document.getElementById('waTitle').value.trim();
    const category = document.getElementById('waCategory').value;
    const image = document.getElementById('waImage').value.trim();
    const excerpt = document.getElementById('waExcerpt').value.trim();
    const body = document.getElementById('waBody').value.trim();
    const author = document.getElementById('waAuthor').value.trim();
    const autoTranslate = document.getElementById('waAutoTranslate').checked;
    const manualBreaking = document.getElementById('waBreaking').checked;

    const statusEl = document.getElementById('waStatus');
    if (!title) { statusEl.textContent = 'Title is required.'; statusEl.className = 'write-status err'; return; }
    if (!editingId && !body) { statusEl.textContent = 'Body is required.'; statusEl.className = 'write-status err'; return; }

    const btn = document.getElementById('waSubmitBtn');
    btn.disabled = true;
    statusEl.className = 'write-status';
    statusEl.textContent = autoTranslate
        ? 'Publishing and translating into 9 languages — this can take up to a minute...'
        : 'Saving...';

    try {
        let data;
        if (editingId) {
            data = await apiPost(`/api/admin/article/${editingId}`, 'PATCH', {
                title, category, excerpt, body, image, author, manualBreaking, retranslate: autoTranslate
            });
        } else {
            data = await apiPost('/api/admin/article/manual', 'POST', {
                title, category, excerpt, body, image, author, manualBreaking, autoTranslate
            });
        }
        if (data.success) {
            statusEl.textContent = data.message || 'Done.';
            statusEl.className = 'write-status ok';
            resetWaForm();
            loadAll();
        } else {
            statusEl.textContent = data.message || 'Something went wrong.';
            statusEl.className = 'write-status err';
        }
    } catch (e) {
        statusEl.textContent = 'Network error — please try again.';
        statusEl.className = 'write-status err';
    } finally {
        btn.disabled = false;
    }
}

async function retranslateMissing(id) {
    const el = document.getElementById('qaStatus');
    el.textContent = 'Filling missing translations...';
    try {
        const data = await apiPost(`/api/admin/article/${id}/retranslate-missing`, 'POST', {});
        el.textContent = data.message || 'Done.';
        loadAll();
    } catch (e) {
        el.textContent = 'Something went wrong.';
    }
}
function exportCSV(type) {
    const data = type === 'articles' ? allArticlesData : type === 'contacts' ? allContactsData : type === 'users' ? allUsersData : allSubscribersData;
    if (!data.length) return;
    const keys = Object.keys(data[0]).filter(k => k !== '__v' && k !== '_id');
    const rows = [keys.join(',')].concat(data.map(row => keys.map(k => `"${String(row[k] ?? '').replace(/"/g, '""')}"`).join(',')));
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `newzyy-${type}.csv`;
    a.click();
}
async function deleteArticle(id) {
    if (!confirm('Delete this article?')) return;
    await apiCall(`/api/admin/article/${id}`, 'DELETE');
    loadAll();
}

function renderContacts(items) {
    allContactsData = items;
    const el = document.getElementById('panel-contacts');
    if (!items.length) { el.innerHTML = '<p style="color:var(--muted)">No messages yet.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th><th>Read</th><th></th></tr></thead><tbody>
        ${items.map(m => `<tr>
            <td>${m.name}</td><td>${m.email}</td><td class="msg-body">${m.message}</td>
            <td>${new Date(m.createdAt).toLocaleString()}</td>
            <td><span class="badge ${m.read ? 'yes' : 'no'}">${m.read ? 'Read' : 'New'}</span></td>
            <td class="row-actions">
                ${!m.read ? `<button onclick="markRead('${m._id}')">Mark Read</button>` : ''}
                <button class="delete" onclick="deleteContact('${m._id}')">Delete</button>
            </td>
        </tr>`).join('')}
    </tbody></table>`;
}
async function markRead(id) { await apiCall(`/api/admin/contact/${id}/read`, 'PATCH'); loadAll(); }
async function deleteContact(id) { if (!confirm('Delete this message?')) return; await apiCall(`/api/admin/contact/${id}`, 'DELETE'); loadAll(); }

function renderUsers(items) {
    allUsersData = items;
    const el = document.getElementById('panel-users');
    if (!items.length) { el.innerHTML = '<p style="color:var(--muted)">No users yet.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Verified</th><th>Bookmarks</th><th>Joined</th><th></th></tr></thead><tbody>
        ${items.map(u => `<tr>
            <td>${u.name}</td><td>${u.email}</td>
            <td><span class="badge ${u.verified ? 'yes' : 'no'}">${u.verified ? 'Yes' : 'No'}</span></td>
            <td>${(u.bookmarks || []).length}</td>
            <td>${new Date(u.createdAt).toLocaleDateString()}</td>
            <td class="row-actions"><button class="delete" onclick="deleteUser('${u._id}')">Delete</button></td>
        </tr>`).join('')}
    </tbody></table>`;
}
async function deleteUser(id) { if (!confirm('Delete this user account?')) return; await apiCall(`/api/admin/user/${id}`, 'DELETE'); loadAll(); }

function renderSubscribers(items) {
    allSubscribersData = items;
    const el = document.getElementById('panel-subscribers');
    if (!items.length) { el.innerHTML = '<p style="color:var(--muted)">No subscribers yet.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>Email</th><th>Active</th><th>Subscribed</th><th>Last Sent</th></tr></thead><tbody>
        ${items.map(s => `<tr><td>${s.email}</td><td><span class="badge ${s.active ? 'yes' : 'no'}">${s.active ? 'Yes' : 'No'}</span></td><td>${new Date(s.subscribedAt).toLocaleDateString()}</td><td>${s.lastSentAt ? new Date(s.lastSentAt).toLocaleDateString() : '—'}</td></tr>`).join('')}
    </tbody></table>`;
}

if (SECRET) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadAll();
}
</script>
